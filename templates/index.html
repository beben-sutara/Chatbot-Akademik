<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Akademik</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="chat-wrapper">
    <!-- Header -->
    <div class="chat-header">
      <div class="avatar">🎓</div>
      <div class="header-info">
        <h1>Asisten Akademik</h1>
        <span class="status">● Online</span>
      </div>
    </div>

    <!-- Message area -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="bubble">
          Halo! Selamat datang di Layanan Akademik Kampus. 👋<br />
          Saya siap membantu kebutuhan akademik Anda.<br /><br />
          Ketik <strong>bantuan</strong> untuk melihat topik yang tersedia.
        </div>
        <span class="time" id="initTime"></span>
      </div>
    </div>

    <!-- Quick actions -->
    <div class="quick-actions" id="quickActions">
      <button class="quick-btn" data-msg="pendaftaran mahasiswa baru">📋 Pendaftaran</button>
      <button class="quick-btn" data-msg="beasiswa">🎯 Beasiswa</button>
      <button class="quick-btn" data-msg="jadwal kuliah">📅 Jadwal</button>
      <button class="quick-btn" data-msg="biaya kuliah">💰 Biaya</button>
      <button class="quick-btn" data-msg="kontak">📞 Kontak</button>
      <button class="quick-btn" data-msg="bantuan">❓ Bantuan</button>
    </div>

    <!-- Input area -->
    <div class="chat-input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ketik pertanyaan Anda di sini..."
        autocomplete="off"
        maxlength="500"
      />
      <button id="sendBtn" aria-label="Kirim pesan">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
